<article class="product-card">
  <a class="product-image" href="{% url 'product_detail' product.slug %}">
    {% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}">{% else %}<span>Product image</span>{% endif %}
  </a>
  <div class="product-info">
    <p class="product-category">{{ product.category.name }}</p>
    <h3><a href="{% url 'product_detail' product.slug %}">{{ product.name }}</a></h3>
    <div class="product-meta"><strong>${{ product.price }}</strong><span>{% if product.stock %}In stock{% else %}Out of stock{% endif %}</span></div>
  </div>
</article>
